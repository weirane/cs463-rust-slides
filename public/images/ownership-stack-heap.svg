<svg xmlns="http://www.w3.org/2000/svg" width="230" height="320" viewBox="0 0 230 320" role="img" aria-labelledby="title">
  <title id="title">A stack pointer refers to heap data</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="28" fill="#000">
    <text x="90" y="30" text-anchor="middle">stack</text>
    <rect x="45" y="45" width="90" height="230" fill="#bde0e3" stroke="#000" stroke-width="1"/>
    <path d="M 45 180 H 135" stroke="#000" stroke-width="1"/>
    <rect x="45" y="75" width="90" height="14" fill="#00f" stroke="#000" stroke-width="1"/>
    <text x="145" y="88">p</text>
    <rect x="45" y="240" width="90" height="24" fill="#00f" stroke="#000" stroke-width="1"/>
    <text x="145" y="258" font-size="24">"hello"</text>
    <path d="M 45 82 C 0 82, 0 252, 44 252" fill="none" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="90" y="310" text-anchor="middle">heap</text>
  </g>
</svg>
